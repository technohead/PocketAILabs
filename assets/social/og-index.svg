<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021"/>
      <stop offset="1" stop-color="#111731"/>
    </linearGradient>
    <radialGradient id="g1" cx="78%" cy="18%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="15%" cy="75%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <!-- logo mark -->
  <g transform="translate(80,70)">
    <circle cx="30" cy="30" r="27" stroke="url(#grad)" stroke-width="5" fill="none"/>
    <circle cx="30" cy="30" r="11" fill="url(#grad)"/>
    <path d="M30 9v7M30 44v7M9 30h7M44 30h7" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="128" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e8ecf6">Pocket <tspan fill="url(#grad)">AI</tspan> Labs</text>
  <!-- headline -->
  <text x="80" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#f4f6ff">On-device AI</text>
  <text x="80" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#grad)">for mobile.</text>
  <text x="80" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#a7afc4">Private, fast, offline — AI apps for iOS &amp; Android.</text>
  <!-- app chips -->
  <g transform="translate(80,486)">
    <rect x="0" y="0" width="180" height="52" rx="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e8ecf6">Kartoonify</text>
  </g>
  <g transform="translate(280,486)">
    <rect x="0" y="0" width="220" height="52" rx="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="24" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e8ecf6">SmartReceipts</text>
  </g>
</svg>
